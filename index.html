<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DnhFun</title>
<meta name="description" content="DnhFun - makers of BoxSorter, a relaxing color sort puzzle game for Android.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #140C30; --card: #26305A; --text: #FFFFFF; --muted: #B8C1E0; --gold: #FFD34D; --link: #8FB8FF; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
         font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 520px; background: var(--card); border-radius: 28px; padding: 36px 28px; text-align: center;
         box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45); }
  img { width: 140px; height: 140px; border-radius: 30px; }
  h1 { margin: 18px 0 4px; font-size: 34px; letter-spacing: 1px; }
  .studio { color: var(--gold); font-weight: 700; margin: 0 0 18px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 22px; }
  .play { display: inline-block; background: #34C759; color: #fff; font-weight: 800; text-decoration: none; font-size: 20px;
          padding: 14px 28px; border-radius: 18px; border-bottom: 5px solid #23913F; }
  footer { margin-top: 28px; font-size: 15px; }
  footer a { color: var(--link); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="BoxSorter icon">
  <h1>BoxSorter</h1>
  <div class="studio">by DnhFun</div>
  <p>A relaxing color sort puzzle: sort the blocks into tubes until every tube holds a single color.
     Hundreds of levels, special mechanics, challenges and daily rewards.</p>
  <a class="play" href="https://play.google.com/store/apps/details?id=com.dnhfun.boxsorter">Get it on Google Play</a>
  <footer><a href="https://sites.google.com/view/dnhfun">Privacy Policy</a> &middot; <a href="terms.html">Terms of Service</a> &middot; <a href="delete-account.html">Delete your data</a></footer>
</main>
</body>
</html>
